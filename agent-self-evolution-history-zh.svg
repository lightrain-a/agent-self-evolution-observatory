<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
<title id="title">Agent 自进化研究的历史、能力、方向与代表方法</title>
<desc id="desc">高密度展示六个历史阶段、能力增长、十个研究方向、范式迁移，以及二十三篇正式发表里程碑论文的简要方法做法。</desc>
<defs>
<style>
.bg{fill:#fff}.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#12213a}.sub{font:15px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#526079}.head{font:700 18px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#fff}.h2{font:700 17px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#18365f}.h3{font:700 14px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#17233a}.body{font:12px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#27364f}.small{font:11px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#526079}.tiny{font:10px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#5d687a}.box{fill:#fff;stroke:#cfd8e6;stroke-width:1.4}.panel{fill:#fbfcff;stroke:#9eb2cd;stroke-width:1.5}.band{fill:#173e70}.rule{stroke:#d5dce8;stroke-width:1}.center{text-anchor:middle}.bold{font-weight:700}
</style>
</defs>
<rect class="bg" width="2400" height="1600"/>
<text x="1200" y="42" class="title center">Agent 自进化研究：历史、能力增长、方向形成与代表方法</text>
<text x="1200" y="70" class="sub center">从基础模型前置工作，到持久记忆、技能生态、工作流搜索、多模态适应与受治理发布</text>

<rect x="25" y="92" width="2350" height="305" rx="14" class="panel"/>
<rect x="25" y="92" width="2350" height="34" rx="14" class="band"/><text x="1200" y="115" class="head center">A · 六阶段历史：更新对象从模型参数逐步扩展到完整 Agent 系统</text>
<g transform="translate(42 142)">
  <g><rect width="365" height="232" rx="12" class="box"/><rect width="365" height="35" rx="12" fill="#2f6b3c"/><text x="18" y="23" class="head">P0 · 2017–2020</text><text x="18" y="62" class="h3">基础模型前置阶段</text><text x="18" y="84" class="small">可复用表示与上下文适应</text><text x="20" y="112" class="body">• Transformer 与大规模预训练</text><text x="20" y="132" class="body">• 通过微调迁移到下游任务</text><text x="20" y="152" class="body">• 通过上下文实现少样本适应</text><text x="20" y="172" class="body">• 尚无持久 Agent 状态</text><line x1="15" y1="187" x2="350" y2="187" class="rule"/><text x="20" y="207" class="tiny">更新：参数 → 上下文</text><text x="20" y="224" class="tiny">反馈：静态语料与示范</text></g>
  <g transform="translate(390 0)"><rect width="365" height="232" rx="12" class="box"/><rect width="365" height="35" rx="12" fill="#2460ad"/><text x="18" y="23" class="head">P1 · 2021–2022</text><text x="18" y="62" class="h3">推理与自举改进</text><text x="18" y="84" class="small">模型开始生成中间监督</text><text x="20" y="112" class="body">• 思维链与一致性推理</text><text x="20" y="132" class="body">• 自生成推理轨迹与数据</text><text x="20" y="152" class="body">• 指令遵循与对齐</text><text x="20" y="172" class="body">• 主要仍是离线改进</text><line x1="15" y1="187" x2="350" y2="187" class="rule"/><text x="20" y="207" class="tiny">更新：提示词、轨迹、参数</text><text x="20" y="224" class="tiny">反馈：答案、推理轨迹与偏好</text></g>
  <g transform="translate(780 0)"><rect width="365" height="232" rx="12" class="box"/><rect width="365" height="35" rx="12" fill="#6540a4"/><text x="18" y="23" class="head">P2 · 2023</text><text x="18" y="62" class="h3">交互式经验闭环</text><text x="18" y="84" class="small">推理、行动、观察、反思与复用</text><text x="20" y="112" class="body">• 推理—行动交互</text><text x="20" y="132" class="body">• 语言强化与情景记忆</text><text x="20" y="152" class="body">• 自监督工具学习</text><text x="20" y="172" class="body">• 早期可复用 Agent 经验</text><line x1="15" y1="187" x2="350" y2="187" class="rule"/><text x="20" y="207" class="tiny">更新：轨迹、记忆、工具</text><text x="20" y="224" class="tiny">反馈：环境结果与执行错误</text></g>
  <g transform="translate(1170 0)"><rect width="365" height="232" rx="12" class="box"/><rect width="365" height="35" rx="12" fill="#8b5b15"/><text x="18" y="23" class="head">P3 · 2024</text><text x="18" y="62" class="h3">持久更新与系统级优化</text><text x="18" y="84" class="small">优化记忆、技能、提示词与 Agent 图</text><text x="20" y="112" class="body">• 将 LLM 作为优化器</text><text x="20" y="132" class="body">• 学习型回顾反馈</text><text x="20" y="152" class="body">• 开放式技能库</text><text x="20" y="172" class="body">• 视觉工具更新闭环</text><line x1="15" y1="187" x2="350" y2="187" class="rule"/><text x="20" y="207" class="tiny">更新：记忆、技能、工作流</text><text x="20" y="224" class="tiny">反馈：已评估历史与迭代试验</text></g>
  <g transform="translate(1560 0)"><rect width="365" height="232" rx="12" class="box"/><rect width="365" height="35" rx="12" fill="#087582"/><text x="18" y="23" class="head">P4 · 2025</text><text x="18" y="62" class="h3">环境驱动进化</text><text x="18" y="84" class="small">课程、GUI/Web、工作流搜索与视觉 Critic</text><text x="20" y="112" class="body">• 在线课程强化学习</text><text x="20" y="132" class="body">• 自动 Agent 与工作流设计</text><text x="20" y="152" class="body">• Web 交互学习</text><text x="20" y="172" class="body">• 视觉批评与纠错</text><line x1="15" y1="187" x2="350" y2="187" class="rule"/><text x="20" y="207" class="tiny">更新：策略、工作流、视觉推理</text><text x="20" y="224" class="tiny">反馈：测试、网站与视觉证据</text></g>
  <g transform="translate(1950 0)"><rect width="365" height="232" rx="12" class="box"/><rect width="365" height="35" rx="12" fill="#c15612"/><text x="18" y="23" class="head">P5 · 2026</text><text x="18" y="62" class="h3">多模态自进化与治理</text><text x="18" y="84" class="small">自博弈、动态记忆、技能生态与安全</text><text x="20" y="112" class="body">• VLM 自博弈与主动探索</text><text x="20" y="132" class="body">• 多模态记忆与动态图</text><text x="20" y="152" class="body">• 长视频工具轨迹进化</text><text x="20" y="172" class="body">• 溯源与发布治理</text><line x1="15" y1="187" x2="350" y2="187" class="rule"/><text x="20" y="207" class="tiny">更新：完整多模态 Agent 系统</text><text x="20" y="224" class="tiny">反馈：世界、评价器与发布门控</text></g>
</g>

<rect x="25" y="420" width="1450" height="390" rx="14" class="panel"/>
<rect x="25" y="420" width="1450" height="34" rx="14" class="band"/><text x="750" y="443" class="head center">B · 不同历史阶段的能力增长</text>
<g transform="translate(45 472)"><rect width="1410" height="315" class="box"/><line x1="245" y1="0" x2="245" y2="315" class="rule"/><line x1="440" y1="0" x2="440" y2="315" class="rule"/><line x1="635" y1="0" x2="635" y2="315" class="rule"/><line x1="830" y1="0" x2="830" y2="315" class="rule"/><line x1="1025" y1="0" x2="1025" y2="315" class="rule"/><line x1="1220" y1="0" x2="1220" y2="315" class="rule"/><line x1="0" y1="52" x2="1410" y2="52" class="rule"/><line x1="0" y1="105" x2="1410" y2="105" class="rule"/><line x1="0" y1="158" x2="1410" y2="158" class="rule"/><line x1="0" y1="211" x2="1410" y2="211" class="rule"/><line x1="0" y1="264" x2="1410" y2="264" class="rule"/>
<text x="14" y="32" class="h3">能力层</text><text x="342" y="24" class="h3 center">P0</text><text x="537" y="24" class="h3 center">P1</text><text x="732" y="24" class="h3 center">P2</text><text x="927" y="24" class="h3 center">P3</text><text x="1122" y="24" class="h3 center">P4</text><text x="1315" y="24" class="h3 center">P5</text>
<text x="14" y="84" class="body bold">当前任务纠错</text><text x="342" y="84" class="small center">提示或微调</text><text x="537" y="84" class="small center">推理轨迹</text><text x="732" y="84" class="small center">反思并重试</text><text x="927" y="84" class="small center">优化器闭环</text><text x="1122" y="84" class="small center">环境反馈</text><text x="1315" y="84" class="small center">多模态纠错</text>
<text x="14" y="137" class="body bold">持久经验</text><text x="342" y="137" class="small center">无</text><text x="537" y="137" class="small center">离线数据</text><text x="732" y="137" class="small center">情景记忆</text><text x="927" y="137" class="small center">修复与巩固</text><text x="1122" y="137" class="small center">任务流</text><text x="1315" y="137" class="small center">多模态记忆</text>
<text x="14" y="190" class="body bold">可复用技能与工具</text><text x="342" y="190" class="small center">人工构建</text><text x="537" y="190" class="small center">提示式工具</text><text x="732" y="190" class="small center">工具学习</text><text x="927" y="190" class="small center">增长型技能库</text><text x="1122" y="190" class="small center">动态 API</text><text x="1315" y="190" class="small center">技能生态</text>
<text x="14" y="243" class="body bold">工作流与自设计</text><text x="342" y="243" class="small center">固定流程</text><text x="537" y="243" class="small center">人工 Scaffold</text><text x="732" y="243" class="small center">Agent 闭环</text><text x="927" y="243" class="small center">系统优化</text><text x="1122" y="243" class="small center">工作流搜索</text><text x="1315" y="243" class="small center">Harness 进化</text>
<text x="14" y="296" class="body bold">受治理开放式进化</text><text x="342" y="296" class="small center">—</text><text x="537" y="296" class="small center">—</text><text x="732" y="296" class="small center">局部检查</text><text x="927" y="296" class="small center">基础回滚</text><text x="1122" y="296" class="small center">纵向测试</text><text x="1315" y="296" class="small center">安全与溯源</text></g>

<rect x="1500" y="420" width="875" height="390" rx="14" class="panel"/>
<rect x="1500" y="420" width="875" height="34" rx="14" class="band"/><text x="1937" y="443" class="head center">C · 十个方向可以先归纳为四个大问题</text>
<g transform="translate(1520 470)"><text x="0" y="18" class="h3">Q1 · Agent 到底应该学什么？</text><text x="300" y="18" class="small">D1 经验准入与范围 · D6 负向进化评测</text><text x="0" y="57" class="h3">Q2 · 经验应该变成什么？</text><text x="300" y="57" class="small">D2 记忆 · D3 技能工具 · D4 路由契约组合</text><text x="0" y="96" class="h3">Q3 · Agent 周围发生了什么变化？</text><text x="300" y="96" class="small">D5 具身世界 · D9 用户目标 · D10 群体进化</text><text x="0" y="135" class="h3">Q4 · 怎样让进化保持可控？</text><text x="300" y="135" class="small">D7 安全溯源 · D8 成本监督元控制</text><line x1="0" y1="154" x2="835" y2="154" class="rule"/><text x="0" y="181" class="body bold">D1</text><text x="50" y="181" class="body">经验准入与适用范围</text><text x="520" y="181" class="tiny">这条经验该不该存？在哪里有效？</text><text x="0" y="207" class="body bold">D2</text><text x="50" y="207" class="body">记忆表示、修复与巩固</text><text x="520" y="207" class="tiny">被接受的经验怎样长期维护？</text><text x="0" y="233" class="body bold">D3</text><text x="50" y="233" class="body">技能、工具与权限生命周期</text><text x="520" y="233" class="tiny">经验怎样变成可执行能力？</text><text x="0" y="259" class="body bold">D4</text><text x="50" y="259" class="body">路由、契约与组合</text><text x="520" y="259" class="tiny">更新哪个组件？组合后还兼容吗？</text><text x="0" y="285" class="body bold">D5–D10</text><text x="90" y="285" class="body">世界适应 · 评测 · 安全 · 治理 · 目标用户 · 群体进化</text><text x="0" y="318" class="tiny">方向是生命周期问题，不是互相竞争的算法；论文 Idea 只选择一个方向中的一个可识别变量。</text></g>

<rect x="25" y="835" width="2350" height="142" rx="14" class="panel"/><rect x="25" y="835" width="2350" height="34" rx="14" class="band"/><text x="1200" y="858" class="head center">D · 七次关键范式迁移</text><g transform="translate(45 885)"><text x="0" y="20" class="body bold">静态模型 → 交互 Agent</text><text x="330" y="20" class="body bold">当前纠错 → 持久经验</text><text x="700" y="20" class="body bold">人工提示词 → 自动优化</text><text x="1120" y="20" class="body bold">固定工具 → 学习型技能</text><text x="1480" y="20" class="body bold">固定工作流 → 系统搜索</text><text x="1870" y="20" class="body bold">纯文本 → 多模态世界</text><text x="0" y="55" class="small">自主提出更新 → 受治理发布：审计、安全、溯源、回滚与资源控制逐步成为方法本身，而不是事后补充。</text></g>

<rect x="25" y="1000" width="2350" height="565" rx="14" class="panel"/><rect x="25" y="1000" width="2350" height="34" rx="14" class="band"/><text x="1200" y="1023" class="head center">E · 按方法族组织的正式发表里程碑——每张卡片直接说明方法大致怎么做</text>

<g transform="translate(45 1050)"><text x="220" y="18" class="h2 center">基础模型与自举</text>
<g data-milestone="Transformer"><rect y="30" width="430" height="58" rx="8" class="box"/><text x="12" y="49" class="body bold">2017 · Transformer</text><text x="12" y="66" class="small">用自注意力建立统一序列建模骨干</text><text x="12" y="81" class="tiny">更新：参数 · 信号：预训练</text></g>
<g data-milestone="BERT" transform="translate(0 66)"><rect y="30" width="430" height="58" rx="8" class="box"/><text x="12" y="49" class="body bold">2019 · BERT</text><text x="12" y="66" class="small">掩码预训练学习可迁移表示</text><text x="12" y="81" class="tiny">更新：参数 · 信号：自监督</text></g>
<g data-milestone="GPT-3" transform="translate(0 132)"><rect y="30" width="430" height="58" rx="8" class="box"/><text x="12" y="49" class="body bold">2020 · GPT-3</text><text x="12" y="66" class="small">通过上下文示例适应新任务</text><text x="12" y="81" class="tiny">更新：上下文行为 · 信号：示范</text></g>
<g data-milestone="CoT" transform="translate(0 198)"><rect y="30" width="430" height="58" rx="8" class="box"/><text x="12" y="49" class="body bold">2022 · Chain-of-Thought</text><text x="12" y="66" class="small">显式生成中间推理轨迹</text><text x="12" y="81" class="tiny">更新：轨迹 · 信号：提示式推理</text></g>
<g data-milestone="STaR" transform="translate(0 264)"><rect y="30" width="430" height="58" rx="8" class="box"/><text x="12" y="49" class="body bold">2022 · STaR</text><text x="12" y="66" class="small">自生成推理、按答案过滤并重新训练</text><text x="12" y="81" class="tiny">更新：模型 · 信号：自生成推理</text></g>
<g data-milestone="Self-Instruct" transform="translate(0 330)"><rect y="30" width="430" height="58" rx="8" class="box"/><text x="12" y="49" class="body bold">2023 · Self-Instruct</text><text x="12" y="66" class="small">由模型自身自举生成指令数据</text><text x="12" y="81" class="tiny">更新：数据／模型 · 信号：生成指令</text></g>
<g data-milestone="OPRO" transform="translate(0 396)"><rect y="30" width="430" height="58" rx="8" class="box"/><text x="12" y="49" class="body bold">2024 · OPRO</text><text x="12" y="66" class="small">让 LLM 迭代提出更优提示词或解</text><text x="12" y="81" class="tiny">更新：提示词 · 信号：评价分数</text></g></g>

<g transform="translate(515 1050)"><text x="220" y="18" class="h2 center">交互、经验与记忆</text>
<g data-milestone="ReAct"><rect y="30" width="430" height="74" rx="8" class="box"/><text x="12" y="49" class="body bold">2023 · ReAct</text><text x="12" y="66" class="small">交替执行推理与环境行动</text><text x="12" y="83" class="tiny">更新：行动轨迹 · 信号：环境观测</text></g>
<g data-milestone="Reflexion" transform="translate(0 86)"><rect y="30" width="430" height="74" rx="8" class="box"/><text x="12" y="49" class="body bold">2023 · Reflexion</text><text x="12" y="66" class="small">把语言反馈写入情景记忆</text><text x="12" y="83" class="tiny">更新：记忆 · 信号：结果＋反思</text></g>
<g data-milestone="Retroformer" transform="translate(0 172)"><rect y="30" width="430" height="74" rx="8" class="box"/><text x="12" y="49" class="body bold">2024 · Retroformer</text><text x="12" y="66" class="small">学习回顾式反馈以优化策略</text><text x="12" y="83" class="tiny">更新：反馈策略 · 信号：轨迹回报</text></g>
<g data-milestone="History to Future" transform="translate(0 258)"><rect y="30" width="430" height="90" rx="8" class="box"/><text x="12" y="49" class="body bold">2026 · History to Future</text><text x="12" y="66" class="small">复用导航历史并生成未来思考</text><text x="12" y="83" class="tiny">更新：导航记忆 · 信号：历史轨迹</text></g>
<rect x="0" y="390" width="430" height="82" rx="8" fill="#f3f6fb" stroke="#cad5e4"/><text x="14" y="414" class="h3">方法族直觉</text><text x="14" y="436" class="small">把任务结果或交互轨迹转化为可复用状态，</text><text x="14" y="453" class="small">从而改变后续任务中的行为。</text></g>

<g transform="translate(985 1050)"><text x="220" y="18" class="h2 center">工具、技能与具身</text>
<g data-milestone="Toolformer"><rect y="30" width="430" height="74" rx="8" class="box"/><text x="12" y="49" class="body bold">2023 · Toolformer</text><text x="12" y="66" class="small">自监督学习何时调用外部工具</text><text x="12" y="83" class="tiny">更新：工具策略 · 信号：工具效用</text></g>
<g data-milestone="Voyager" transform="translate(0 86)"><rect y="30" width="430" height="74" rx="8" class="box"/><text x="12" y="49" class="body bold">2024 · Voyager</text><text x="12" y="66" class="small">主动探索并增长可执行技能库</text><text x="12" y="83" class="tiny">更新：技能／记忆 · 信号：环境成功</text></g>
<g data-milestone="CLOVA" transform="translate(0 172)"><rect y="30" width="430" height="74" rx="8" class="box"/><text x="12" y="49" class="body bold">2024 · CLOVA</text><text x="12" y="66" class="small">在视觉工具使用与工具更新间形成闭环</text><text x="12" y="83" class="tiny">更新：视觉工具 · 信号：反馈／反思</text></g>
