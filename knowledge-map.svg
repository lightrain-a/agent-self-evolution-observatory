<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">Agent self-evolution knowledge map</title>
  <desc id="desc">A mechanism-first map from experience and evidence through validation and update routing to persistent agent components and future-task evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8f9ff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <linearGradient id="core" x1="0" x2="1"><stop stop-color="#7257e7"/><stop offset="1" stop-color="#2f6fd6"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#0c9b71"/><stop offset="1" stop-color="#42c79a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b88a2"/></marker>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:24px;font-weight:800}.s{font-size:17px;font-weight:700}.b{font-size:14px;fill:#536079}.tiny{font-size:12px;fill:#667085}.box{fill:#fff;stroke:#dce3ee;stroke-width:1.5;rx:17}.edge{stroke:#7b88a2;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 7}.pill{fill:#f1f3f8;stroke:#dfe4ed;rx:13}.white{fill:#fff}.muted{fill:#dbe5ff}
    </style>
  </defs>
  <rect width="1400" height="790" rx="30" fill="url(#bg)"/>
  <text class="t h" x="65" y="58">Agent Self-Evolution: Experience → Verified Update → Future Capability</text>
  <text class="t b" x="65" y="86">Persistent improvement requires a committed change and evidence on future tasks—not only another retry.</text>

  <g filter="url(#shadow)">
    <rect class="box" x="55" y="130" width="250" height="250"/>
    <text class="t s" x="80" y="165">1 · Experience sources</text>
    <rect class="pill" x="80" y="190" width="200" height="39"/><text class="t b" x="98" y="215">Environment outcomes</text>
    <rect class="pill" x="80" y="239" width="200" height="39"/><text class="t b" x="98" y="264">Self-generated tasks</text>
    <rect class="pill" x="80" y="288" width="200" height="39"/><text class="t b" x="98" y="313">Critiques and judges</text>
    <rect class="pill" x="80" y="337" width="200" height="39"/><text class="t b" x="98" y="362">Peers, humans, tools</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="box" x="365" y="130" width="285" height="250"/>
    <text class="t s" x="390" y="165">2 · Evidence and diagnosis</text>
    <text class="t b" x="390" y="204">What caused success or failure?</text>
    <text class="t tiny" x="390" y="235">• perception / grounding</text>
    <text class="t tiny" x="390" y="262">• memory / stale state</text>
    <text class="t tiny" x="390" y="289">• planning / coordination</text>
    <text class="t tiny" x="390" y="316">• tool / execution</text>
    <rect x="390" y="337" width="235" height="30" rx="15" fill="#fff4df" stroke="#f0d39b"/>
    <text class="t tiny" x="409" y="357" fill="#805000">counterfactual verification</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="710" y="130" width="285" height="250" rx="18" fill="url(#core)"/>
    <text class="t s white" x="735" y="165">3 · Update router</text>
    <text class="t b muted" x="735" y="201">Choose the smallest effective change</text>
    <rect x="735" y="225" width="235" height="34" rx="12" fill="#ffffff" fill-opacity=".14"/><text class="t tiny white" x="752" y="247">abstain / request evidence</text>
    <rect x="735" y="269" width="235" height="34" rx="12" fill="#ffffff" fill-opacity=".14"/><text class="t tiny white" x="752" y="291">memory or context</text>
    <rect x="735" y="313" width="235" height="34" rx="12" fill="#ffffff" fill-opacity=".14"/><text class="t tiny white" x="752" y="335">skill, tool, workflow, model</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="box" x="1055" y="130" width="290" height="250"/>
    <text class="t s" x="1080" y="165">4 · Persistent surfaces</text>
    <text class="t tiny" x="1080" y="205">Model parameters</text><rect x="1224" y="192" width="92" height="18" rx="9" fill="#7057e7" fill-opacity=".8"/>
    <text class="t tiny" x="1080" y="239">Prompt / context</text><rect x="1224" y="226" width="76" height="18" rx="9" fill="#547fe0" fill-opacity=".8"/>
    <text class="t tiny" x="1080" y="273">Memory</text><rect x="1224" y="260" width="62" height="18" rx="9" fill="#2f9e82" fill-opacity=".8"/>
    <text class="t tiny" x="1080" y="307">Tools / skills</text><rect x="1224" y="294" width="88" height="18" rx="9" fill="#e0a93d" fill-opacity=".85"/>
    <text class="t tiny" x="1080" y="341">Workflow / world model</text><rect x="1224" y="328" width="104" height="18" rx="9" fill="#d76b7b" fill-opacity=".8"/>
  </g>

  <path class="edge" d="M305 255H350"/><path class="edge" d="M650 255H695"/><path class="edge" d="M995 255H1040"/>

  <g filter="url(#shadow)">
    <rect x="185" y="460" width="1030" height="170" rx="22" fill="#fff" stroke="#dce3ee" stroke-width="1.5"/>
    <text class="t s" x="215" y="498">5 · Release gate and longitudinal evaluation</text>
    <rect x="215" y="525" width="166" height="65" rx="14" fill="#f3f4ff" stroke="#dfe1ff"/><text class="t tiny" x="240" y="552">Validity &amp;</text><text class="t tiny" x="240" y="573">activation</text>
    <rect x="401" y="525" width="166" height="65" rx="14" fill="#f3f4ff" stroke="#dfe1ff"/><text class="t tiny" x="426" y="552">Transfer &amp;</text><text class="t tiny" x="426" y="573">retention</text>
    <rect x="587" y="525" width="166" height="65" rx="14" fill="#eef8f4" stroke="#c9eadf"/><text class="t tiny" x="612" y="552">Evidence</text><text class="t tiny" x="612" y="573">reliance</text>
    <rect x="773" y="525" width="166" height="65" rx="14" fill="#fff7e8" stroke="#f0d9aa"/><text class="t tiny" x="798" y="552">Cost &amp;</text><text class="t tiny" x="798" y="573">autonomy</text>
    <rect x="959" y="525" width="226" height="65" rx="14" fill="url(#green)"/><text class="t tiny white" x="984" y="552">Commit, monitor,</text><text class="t tiny white" x="984" y="573">rollback or merge</text>
  </g>
  <path class="edge" d="M1200 380V443H1100"/><path class="edge dash" d="M215 630V690H840V643"/>
  <text class="t b" x="195" y="726">Future-task evidence feeds the next evolution cycle; harmful or unsupported updates must be rejected or rolled back.</text>
</svg>