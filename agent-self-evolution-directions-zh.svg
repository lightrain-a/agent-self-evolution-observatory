<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Agent 自进化研究方向与论文 Idea 地图</title>
<desc id="desc">十个研究方向组织三十四个具体论文 Idea，并展示从领域、方向、论文 Idea 到选中论文工作区的层级。</desc>
<defs>
<style>
.bg{fill:#fff}.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#172033}.sub{font:16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#536079}.head{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif}.body{font:13px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#344054}.tiny{font:11px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#5b6678}.code{font:800 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.card{fill:#fff;stroke:#dce3ee;stroke-width:1.5}.arrow{stroke:#7b88a2;stroke-width:2.5;fill:none;marker-end:url(#arr)}.pill{fill:#f7f8fb;stroke:#e1e6ef}.white{fill:#fff}.center{text-anchor:middle}
</style>
<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7b88a2"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity=".10"/></filter>
</defs>
<rect class="bg" width="1920" height="1080"/>
<text x="960" y="45" class="title center">Agent 自进化：10 个研究方向 → 34 个具体论文 Idea</text>
<text x="960" y="74" class="sub center">方向是稳定的科学小领域；Idea 是包含方法、实验、基线与 Go／Stop 规则的可证伪论文方案。</text>

<!-- hierarchy -->
<g filter="url(#shadow)">
<rect x="150" y="105" width="310" height="92" rx="18" fill="#eef0ff" stroke="#cfd3ff"/>
<text x="305" y="137" class="head center" fill="#4141a6">领域</text><text x="305" y="166" class="body center">Agent 自进化</text>
<rect x="560" y="105" width="310" height="92" rx="18" fill="#eef6ff" stroke="#c7dcf7"/>
<text x="715" y="137" class="head center" fill="#215ea9">研究方向</text><text x="715" y="166" class="body center">稳定的一组科学问题</text>
<rect x="970" y="105" width="310" height="92" rx="18" fill="#eef8f4" stroke="#c9eadf"/>
<text x="1125" y="137" class="head center" fill="#087e5b">论文 Idea</text><text x="1125" y="166" class="body center">具体、可证伪的论文方案</text>
<rect x="1380" y="105" width="390" height="92" rx="18" fill="#fff7e8" stroke="#f0d9aa"/>
<text x="1575" y="137" class="head center" fill="#8a5300">选中论文工作区</text><text x="1575" y="166" class="body center">问题 · 实验 · 路线图 · 评审</text>
</g>
<path d="M460 151 H545" class="arrow"/><path d="M870 151 H955" class="arrow"/><path d="M1280 151 H1365" class="arrow"/>

<!-- lifecycle -->
<text x="65" y="245" class="head" fill="#344054">持久自进化生命周期</text>
<g>
<rect x="65" y="266" width="330" height="58" rx="15" class="pill"/><text x="230" y="291" class="body center"><tspan font-weight="700">经验／初始化</tspan><tspan x="230" dy="18" class="tiny">任务、结果、同伴、人类与工具</tspan></text>
<rect x="430" y="266" width="330" height="58" rx="15" class="pill"/><text x="595" y="291" class="body center"><tspan font-weight="700">提出更新</tspan><tspan x="595" dy="18" class="tiny">经验、记忆、技能、工具、工作流、模型</tspan></text>
<rect x="795" y="266" width="330" height="58" rx="15" class="pill"/><text x="960" y="291" class="body center"><tspan font-weight="700">评测</tspan><tspan x="960" dy="18" class="tiny">因果、范围、交互、安全与成本</tspan></text>
<rect x="1160" y="266" width="330" height="58" rx="15" class="pill"/><text x="1325" y="291" class="body center"><tspan font-weight="700">提交／回滚</tspan><tspan x="1325" dy="18" class="tiny">版本、契约、溯源与授权</tspan></text>
<rect x="1525" y="266" width="330" height="58" rx="15" class="pill"/><text x="1690" y="291" class="body center"><tspan font-weight="700">部署／监控</tspan><tspan x="1690" dy="18" class="tiny">未来任务、漂移、传播与退役</tspan></text>
</g>
<path d="M395 295 H415" class="arrow"/><path d="M760 295 H780" class="arrow"/><path d="M1125 295 H1145" class="arrow"/><path d="M1490 295 H1510" class="arrow"/>

<!-- row 1 cards -->
<g filter="url(#shadow)">
<rect x="25" y="365" width="350" height="300" rx="18" class="card"/><rect x="25" y="365" width="350" height="46" rx="18" fill="#5b5bd6"/><text x="48" y="394" class="code">D1</text><text x="82" y="394" class="head white">经验获取、准入与范围</text>
<text x="48" y="438" class="tiny">哪些经验值得持久学习，经验在哪些状态中成立？</text>
<text x="48" y="474" class="body">• GroundEvo-Admission</text><text x="48" y="508" class="body">• ScopeGuard-V</text><text x="48" y="542" class="body">• EvoValue-V</text><text x="48" y="576" class="body">• ProcessCredit-V</text>
<text x="48" y="630" class="tiny">准入 · 适用范围 · 获取价值 · 过程归因</text>

<rect x="397" y="365" width="350" height="300" rx="18" class="card"/><rect x="397" y="365" width="350" height="46" rx="18" fill="#2f6fd6"/><text x="420" y="394" class="code">D2</text><text x="454" y="394" class="head white">记忆表示、修复与巩固</text>
<text x="420" y="438" class="tiny">记忆应如何表示、修订、晋升与安全删除？</text>
<text x="420" y="474" class="body">• ViMEvo-Repair</text><text x="420" y="508" class="body">• MemoryFormRouter-V</text><text x="420" y="542" class="body">• MultiRateEvo-V</text><text x="420" y="576" class="body">• EvoGC-X</text>
<text x="420" y="630" class="tiny">表示 · 修复 · 巩固 · 跨表面垃圾回收</text>

<rect x="769" y="365" width="350" height="300" rx="18" class="card"/><rect x="769" y="365" width="350" height="46" rx="18" fill="#087e5b"/><text x="792" y="394" class="code">D3</text><text x="826" y="394" class="head white">技能、工具与权限生命周期</text>
<text x="792" y="438" class="tiny">可复用能力应如何验证、修复、退役与重新授权？</text>
<text x="792" y="474" class="body">• SkillProof-V</text><text x="792" y="508" class="body">• SkillUnlearn-V</text><text x="792" y="542" class="body">• CapabilityLease-Evo</text>
<text x="792" y="630" class="tiny">契约 · 修复 · 退役 · 权限续租</text>

<rect x="1141" y="365" width="350" height="300" rx="18" class="card"/><rect x="1141" y="365" width="350" height="46" rx="18" fill="#7c4dcc"/><text x="1164" y="394" class="code">D4</text><text x="1198" y="394" class="head white">更新路由、契约与组合</text>
<text x="1164" y="438" class="tiny">应更新哪个组件，多个更新能否组合成立？</text>
<text x="1164" y="474" class="body">• EvoContract-V</text><text x="1164" y="508" class="body">• InteractionGuard-V</text><text x="1164" y="542" class="body">• UpdateRoute-V</text>
<text x="1164" y="630" class="tiny">更新表面 · 语义兼容 · 跨更新干扰</text>

<rect x="1513" y="365" width="382" height="300" rx="18" class="card"/><rect x="1513" y="365" width="382" height="46" rx="18" fill="#c56a1a"/><text x="1536" y="394" class="code">D5</text><text x="1570" y="394" class="head white">具身、探索与世界适应</text>
<text x="1536" y="438" class="tiny">Agent 应如何诊断变化中的身体、状态与环境？</text>
<text x="1536" y="474" class="body">• EgoShift</text><text x="1536" y="508" class="body">• ExploreRepair-V</text><text x="1536" y="542" class="body">• WorldPatch-V</text><text x="1536" y="576" class="body">• SimEvo-CF</text>
<text x="1536" y="630" class="tiny">传感器漂移 · 主动探索 · 世界修补 · 环境共进化</text>
</g>

<!-- row 2 cards -->
<g filter="url(#shadow)">
<rect x="25" y="690" width="350" height="300" rx="18" class="card"/><rect x="25" y="690" width="350" height="46" rx="18" fill="#a12f42"/><text x="48" y="719" class="code">D6</text><text x="82" y="719" class="head white">负向进化评测与基准</text>
<text x="48" y="763" class="tiny">哪些失败会被平均任务成功率掩盖？</text>
<text x="48" y="799" class="body">• NegEvoBench-V</text><text x="48" y="833" class="body">• RelianceGuard-V</text><text x="48" y="867" class="body">• AuditInvariant-Evo</text><text x="48" y="901" class="body">• EvalRedQueen-V</text>
<text x="48" y="955" class="tiny">基准 · Grounding 漂移 · 审计差距 · 评价器技术债</text>

<rect x="397" y="690" width="350" height="300" rx="18" class="card"/><rect x="397" y="690" width="350" height="46" rx="18" fill="#b54708"/><text x="420" y="719" class="code">D7</text><text x="454" y="719" class="head white">安全、溯源与风险传播</text>
<text x="420" y="763" class="tiny">有害更新如何沿后代版本与 Agent 群体传播？</text>
<text x="420" y="799" class="body">• AmplificationGuard-X</text><text x="420" y="833" class="body">• EvoFirewall-V</text><text x="420" y="867" class="body">• ConfidenceFlow-Evo</text><text x="420" y="901" class="body">• EvoProvenance-V</text>
<text x="420" y="955" class="tiny">投毒 · 放大 · 不确定性传播 · 版本谱系</text>

<rect x="769" y="690" width="350" height="300" rx="18" class="card"/><rect x="769" y="690" width="350" height="46" rx="18" fill="#8a5300"/><text x="792" y="719" class="code">D8</text><text x="826" y="719" class="head white">成本、监督与元控制</text>
<text x="792" y="763" class="tiny">有限算力与人工注意力应如何分配？</text>
<text x="792" y="799" class="body">• BudgetEvolve-V</text><text x="792" y="833" class="body">• OversightBudget-Evo</text><text x="792" y="867" class="body">• MetaGuard-V</text>
<text x="792" y="955" class="tiny">预算分配 · 人工升级 · 控制器校准</text>

<rect x="1141" y="690" width="350" height="300" rx="18" class="card"/><rect x="1141" y="690" width="350" height="46" rx="18" fill="#0f7780"/><text x="1164" y="719" class="code">D9</text><text x="1198" y="719" class="head white">目标、个性化与内生反馈</text>
<text x="1164" y="763" class="tiny">目标与用户模型应如何随部署反馈进化？</text>
<text x="1164" y="799" class="body">• GoalGuard-Evo</text><text x="1164" y="833" class="body">• PersonaShift-V</text><text x="1164" y="867" class="body">• PerformativeEvo-V</text>
<text x="1164" y="955" class="tiny">目标约束 · 偏好漂移 · Agent 自致分布变化</text>

<rect x="1513" y="690" width="382" height="300" rx="18" class="card"/><rect x="1513" y="690" width="382" height="46" rx="18" fill="#4b6b88"/><text x="1536" y="719" class="code">D10</text><text x="1578" y="719" class="head white">跨 Agent 迁移与复数谱系</text>
<text x="1536" y="763" class="tiny">经验与版本何时应共享、分支、合并或退役？</text>
<text x="1536" y="799" class="body">• CrossAgentTransfer-V</text><text x="1536" y="833" class="body">• PluralLineage-Evo</text>
<text x="1536" y="955" class="tiny">经验证迁移 · 专门化 · 持久分支</text>
</g>
<text x="35" y="1045" class="tiny">Agent Self-Evolution Observatory · 方向用于组织领域；论文 Idea 是具体可执行方案。</text>
</svg>