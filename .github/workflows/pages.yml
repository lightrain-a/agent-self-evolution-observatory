name: Deploy frontend-only GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-frontend-only
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Cancel generated Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cancel_legacy_pages_runs.py

      - name: Build frontend-only static site
        run: python3 scripts/build_static_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@v4

      - name: Recover locks and deploy frontend artifact
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ""
        run: python3 scripts/recover_pages_deployment.py
