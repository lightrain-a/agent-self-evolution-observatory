name: Capture R9 official HF provenance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/r9-hf-provenance.yml
      - scripts/capture_r9_hf_official_metadata.py
      - research_pipeline/paper_first_agent_safety_r9_harness.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r9-hf-provenance-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture literal huggingface.co exact-revision metadata
        run: python3 scripts/capture_r9_hf_official_metadata.py

      - name: Validate zero-authority capture
        run: python3 scripts/capture_r9_hf_official_metadata.py --validate generated/agent-safety-r9-official-hf-metadata-capture.json

      - name: Publish content-addressed capture branch
        run: |
          set -euo pipefail
          git config user.name "Agent Evolution Automation"
          git config user.email "agent-evolution-bot@users.noreply.github.com"
          git add -f generated/agent-safety-r9-official-hf-metadata-capture.json
          git commit -m "chore(agent-safety): capture official R9 HF metadata"
          git push --force origin HEAD:refs/heads/r9-hf-provenance-capture
