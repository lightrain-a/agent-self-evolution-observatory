<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Evidence-backed research directions in agent self-evolution</title>
<desc id="desc">Ten research directions are grounded by twenty representative papers, each with a one-line method description; thirty-four paper ideas remain linked on the website.</desc>
<defs>
<style>
.bg{fill:#fff}.title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#172033}.sub{font:16px Inter,Segoe UI,Arial,sans-serif;fill:#536079}.head{font:700 18px Inter,Segoe UI,Arial,sans-serif}.body{font:13px Inter,Segoe UI,Arial,sans-serif;fill:#344054}.tiny{font:11px Inter,Segoe UI,Arial,sans-serif;fill:#5b6678}.code{font:800 12px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.card{fill:#fff;stroke:#dce3ee;stroke-width:1.5}.arrow{stroke:#7b88a2;stroke-width:2.5;fill:none;marker-end:url(#arr)}.pill{fill:#f7f8fb;stroke:#e1e6ef}.white{fill:#fff}.center{text-anchor:middle}
</style>
<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7b88a2"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity=".10"/></filter>
</defs>
<rect class="bg" width="1920" height="1080"/>
<text x="960" y="45" class="title center">Agent Self-Evolution: 10 Evidence-Backed Research Directions</text>
<text x="960" y="74" class="sub center">Each direction cites representative literature and summarizes its method in one line; 34 concrete paper ideas remain linked on the website.</text>

<!-- hierarchy -->
<g filter="url(#shadow)">
<rect x="150" y="105" width="310" height="92" rx="18" fill="#eef0ff" stroke="#cfd3ff"/>
<text x="305" y="137" class="head center" fill="#4141a6">FIELD</text><text x="305" y="166" class="body center">Agent self-evolution</text>
<rect x="560" y="105" width="310" height="92" rx="18" fill="#eef6ff" stroke="#c7dcf7"/>
<text x="715" y="137" class="head center" fill="#215ea9">DIRECTION</text><text x="715" y="166" class="body center">Stable family of research questions</text>
<rect x="970" y="105" width="310" height="92" rx="18" fill="#eef8f4" stroke="#c9eadf"/>
<text x="1125" y="137" class="head center" fill="#087e5b">PAPER IDEA</text><text x="1125" y="166" class="body center">Concrete falsifiable paper plan</text>
<rect x="1380" y="105" width="390" height="92" rx="18" fill="#fff7e8" stroke="#f0d9aa"/>
<text x="1575" y="137" class="head center" fill="#8a5300">SELECTED PAPER WORKSPACE</text><text x="1575" y="166" class="body center">Problem · experiments · roadmap · review</text>
</g>
<path d="M460 151 H545" class="arrow"/><path d="M870 151 H955" class="arrow"/><path d="M1280 151 H1365" class="arrow"/>

<!-- lifecycle -->
<text x="65" y="245" class="head" fill="#344054">Persistent evolution lifecycle</text>
<g>
<rect x="65" y="266" width="330" height="58" rx="15" class="pill"/><text x="230" y="291" class="body center"><tspan font-weight="700">Experience / bootstrap</tspan><tspan x="230" dy="18" class="tiny">tasks, outcomes, peers, humans, tools</tspan></text>
<rect x="430" y="266" width="330" height="58" rx="15" class="pill"/><text x="595" y="291" class="body center"><tspan font-weight="700">Propose</tspan><tspan x="595" dy="18" class="tiny">lesson, memory, skill, tool, workflow, model</tspan></text>
<rect x="795" y="266" width="330" height="58" rx="15" class="pill"/><text x="960" y="291" class="body center"><tspan font-weight="700">Evaluate</tspan><tspan x="960" dy="18" class="tiny">causality, scope, interaction, safety, cost</tspan></text>
<rect x="1160" y="266" width="330" height="58" rx="15" class="pill"/><text x="1325" y="291" class="body center"><tspan font-weight="700">Commit / rollback</tspan><tspan x="1325" dy="18" class="tiny">version, contract, provenance, authorization</tspan></text>
<rect x="1525" y="266" width="330" height="58" rx="15" class="pill"/><text x="1690" y="291" class="body center"><tspan font-weight="700">Serve / monitor</tspan><tspan x="1690" dy="18" class="tiny">future tasks, drift, propagation, retirement</tspan></text>
</g>
<path d="M395 295 H415" class="arrow"/><path d="M760 295 H780" class="arrow"/><path d="M1125 295 H1145" class="arrow"/><path d="M1490 295 H1510" class="arrow"/>

<!-- row 1 cards -->
<g filter="url(#shadow)">
<rect x="25" y="365" width="350" height="300" rx="18" class="card"/><rect x="25" y="365" width="350" height="46" rx="18" fill="#5b5bd6"/><text x="48" y="394" class="code">D1</text><text x="82" y="394" class="head white">Experience admission &amp; scope</text>
<text x="48" y="438" class="tiny">Which experience deserves persistent learning?</text>
<text data-paper="EVE-Agent" x="48" y="474" class="body">EVE-Agent (2026)</text><text x="48" y="496" class="tiny">Verifies question–answer–evidence before update admission.</text>
<text data-paper="Active Zero" x="48" y="530" class="body">Active Zero (2026)</text><text x="48" y="552" class="tiny">Actively acquires visual data near the capability frontier.</text>
<text x="48" y="588" class="tiny">4 ideas · admission · scope · acquisition · credit</text>

<rect x="397" y="365" width="350" height="300" rx="18" class="card"/><rect x="397" y="365" width="350" height="46" rx="18" fill="#2f6fd6"/><text x="420" y="394" class="code">D2</text><text x="454" y="394" class="head white">Memory lifecycle</text>
<text x="420" y="438" class="tiny">How should memories be represented, repaired, and retired?</text>
<text data-paper="MemSkill" x="420" y="474" class="body">MemSkill (2026)</text><text x="420" y="496" class="tiny">Learns extraction, consolidation, and pruning operations.</text>
<text data-paper="EvoMemBench" x="420" y="530" class="body">EvoMemBench (2026)</text><text x="420" y="552" class="tiny">Compares memory forms across persistent task streams.</text>
<text x="420" y="588" class="tiny">4 ideas · representation · repair · consolidation · deletion</text>

<rect x="769" y="365" width="350" height="300" rx="18" class="card"/><rect x="769" y="365" width="350" height="46" rx="18" fill="#087e5b"/><text x="792" y="394" class="code">D3</text><text x="826" y="394" class="head white">Skill, tool &amp; permission lifecycle</text>
<text x="792" y="438" class="tiny">How should reusable capabilities evolve safely?</text>
<text data-paper="Voyager" x="792" y="474" class="body">Voyager (TMLR 2024)</text><text x="792" y="496" class="tiny">Grows an executable skill library from curriculum feedback.</text>
<text data-paper="VASO" x="792" y="530" class="body">VASO (2026)</text><text x="792" y="552" class="tiny">Adds formal contracts and counterexamples to evolving skills.</text>
<text x="792" y="588" class="tiny">3 ideas · contracts · repair · retirement · authorization</text>

<rect x="1141" y="365" width="350" height="300" rx="18" class="card"/><rect x="1141" y="365" width="350" height="46" rx="18" fill="#7c4dcc"/><text x="1164" y="394" class="code">D4</text><text x="1198" y="394" class="head white">Routing, contracts &amp; composition</text>
<text x="1164" y="438" class="tiny">Which component changes, and will updates compose?</text>
<text data-paper="AFlow" x="1164" y="474" class="body">AFlow (ICLR 2025)</text><text x="1164" y="496" class="tiny">Searches executable agent workflows with task feedback.</text>
<text data-paper="Autogenesis" x="1164" y="530" class="body">Autogenesis (2026)</text><text x="1164" y="552" class="tiny">Versions components with lineage, contracts, and rollback.</text>
<text x="1164" y="588" class="tiny">3 ideas · routing · semantics · interaction · composition</text>

<rect x="1513" y="365" width="382" height="300" rx="18" class="card"/><rect x="1513" y="365" width="382" height="46" rx="18" fill="#c56a1a"/><text x="1536" y="394" class="code">D5</text><text x="1570" y="394" class="head white">Embodiment &amp; world adaptation</text>
<text x="1536" y="438" class="tiny">How should agents diagnose changing bodies and worlds?</text>
<text data-paper="Self-evolving Embodied AI" x="1536" y="474" class="body">Self-evolving Embodied AI (2026)</text><text x="1536" y="496" class="tiny">Separates memory, task, world, body, and model adaptation.</text>
<text data-paper="World Model Implanting" x="1536" y="530" class="body">World Model Implanting (2025)</text><text x="1536" y="552" class="tiny">Retrieves domain world models for test-time adaptation.</text>
<text x="1536" y="588" class="tiny">4 ideas · sensor drift · exploration · world repair</text>
</g>

<!-- row 2 cards -->
<g filter="url(#shadow)">
<rect x="25" y="690" width="350" height="300" rx="18" class="card"/><rect x="25" y="690" width="350" height="46" rx="18" fill="#a12f42"/><text x="48" y="719" class="code">D6</text><text x="82" y="719" class="head white">Negative-evolution evaluation</text>
<text x="48" y="763" class="tiny">Which failures are hidden by average success?</text>
<text data-paper="SEA-Eval" x="48" y="799" class="body">SEA-Eval (2026)</text><text x="48" y="821" class="tiny">Evaluates long-term version trajectories, not one episode.</text>
<text data-paper="Hidden Forgetting" x="48" y="855" class="body">Hidden Forgetting (2026)</text><text x="48" y="877" class="tiny">Reveals grounding loss hidden by stable accuracy.</text>
<text x="48" y="913" class="tiny">4 ideas · trajectory metrics · hidden regressions · audit gap</text>

<rect x="397" y="690" width="350" height="300" rx="18" class="card"/><rect x="397" y="690" width="350" height="46" rx="18" fill="#b54708"/><text x="420" y="719" class="code">D7</text><text x="454" y="719" class="head white">Security, provenance &amp; propagation</text>
<text x="420" y="763" class="tiny">How do harmful updates spread through descendants?</text>
<text data-paper="MemPoison" x="420" y="799" class="body">MemPoison (2026)</text><text x="420" y="821" class="tiny">Tests direct, compositional, and dormant memory attacks.</text>
<text data-paper="Safety in Self-Evolving Agents" x="420" y="855" class="body">Safety in Self-Evolving Agents (2026)</text><text x="420" y="877" class="tiny">Maps persistent threats and cross-generation amplification.</text>
<text x="420" y="913" class="tiny">4 ideas · poisoning · propagation · uncertainty · lineage</text>

<rect x="769" y="690" width="350" height="300" rx="18" class="card"/><rect x="769" y="690" width="350" height="46" rx="18" fill="#8a5300"/><text x="792" y="719" class="code">D8</text><text x="826" y="719" class="head white">Cost, oversight &amp; meta-control</text>
<text x="792" y="763" class="tiny">How should compute and human attention be allocated?</text>
<text data-paper="Towards Healthy Evolution" x="792" y="799" class="body">Towards Healthy Evolution (2026)</text><text x="792" y="821" class="tiny">Finds where limited human supervision helps most.</text>
<text data-paper="Oversight Has a Capacity" x="792" y="855" class="body">Oversight Has a Capacity (2026)</text><text x="792" y="877" class="tiny">Allocates review under fatigue and finite capacity.</text>
<text x="792" y="913" class="tiny">3 ideas · budget · escalation · stopping · meta-control</text>

<rect x="1141" y="690" width="350" height="300" rx="18" class="card"/><rect x="1141" y="690" width="350" height="46" rx="18" fill="#0f7780"/><text x="1164" y="719" class="code">D9</text><text x="1198" y="719" class="head white">Goals, personalization &amp; feedback</text>
<text x="1164" y="763" class="tiny">How should goals and user models evolve?</text>
<text data-paper="Goal-Evolving Agents" x="1164" y="799" class="body">Goal-Evolving Agents (2025)</text><text x="1164" y="821" class="tiny">Evolves computable goals in an outer optimization loop.</text>
<text data-paper="Partially Performative Prediction" x="1164" y="855" class="body">Partially Performative Prediction (2026)</text><text x="1164" y="877" class="tiny">Separates agent-induced change from external drift.</text>
<text x="1164" y="913" class="tiny">3 ideas · goal evolution · preference drift · feedback</text>

<rect x="1513" y="690" width="382" height="300" rx="18" class="card"/><rect x="1513" y="690" width="382" height="46" rx="18" fill="#4b6b88"/><text x="1536" y="719" class="code">D10</text><text x="1578" y="719" class="head white">Cross-agent &amp; plural lineages</text>
<text x="1536" y="763" class="tiny">When should agents share, branch, merge, or retire?</text>
<text data-paper="Decentralized-Memory MAS" x="1536" y="799" class="body">Decentralized-Memory MAS (2026)</text><text x="1536" y="821" class="tiny">Preserves agent diversity with local memory pools.</text>
<text data-paper="Red Queen Gödel Machine" x="1536" y="855" class="body">Red Queen Gödel Machine (2026)</text><text x="1536" y="877" class="tiny">Co-evolves agents and evaluators under changing utility.</text>
<text x="1536" y="913" class="tiny">2 ideas · verified transfer · branching · specialization</text>
</g>
<text x="35" y="1045" class="tiny">Agent Self-Evolution Observatory · Representative papers ground each direction; full citations and six-part analyses are available on the website.</text>
</svg>